[project]
name = "luma-engine"
version = "0.1.0"
description = "Luma verification pipeline: claim decomposition + PubMed grounding + calibrated confidence."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.28.1",
]

[project.scripts]
luma-mcp = "luma.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luma"]
